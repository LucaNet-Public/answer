name: Lucanet Answer tests
on:
  push:
    branches: [lucanet]
  pull_request:
    branches: [lucanet]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Test maintained Answer behavior
        run: >-
          go test -mod=readonly
          ./pkg/gravatar/ ./internal/service/comment/ ./internal/service/review/
          ./internal/service/notification/ ./cmd/ ./internal/base/middleware/
          ./internal/repo/user/ ./internal/service/follow/
          ./internal/service/user_notification_config/ ./internal/service/user_external_login/
          ./internal/repo/user_external_login/ ./internal/controller/ ./internal/router/
          ./internal/service/object_info/ ./plugin/
